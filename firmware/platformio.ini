[platformio]
default_envs = waveshare_esp32_s3_display

[env:waveshare_esp32_s3_display]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DAILY_BRIEFING_MOCK_DATA=1
lib_deps =
  moononournation/GFX Library for Arduino@1.5.0

[env:waveshare_esp32_s3_display_ota]
extends = env:waveshare_esp32_s3_display
upload_protocol = espota
upload_port = daily-briefing-dashboard.local
